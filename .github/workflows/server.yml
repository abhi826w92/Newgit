name: Relay Server Daemon

on:
  workflow_dispatch:
  repository_dispatch:
    types: [relay-handoff, auto-restart, ping]
  schedule:
    # Safety fallback trigger every 6 hours (in case runner terminates unexpectedly)
    - cron: '0 */6 * * *'

# Ensure ONLY ONE active runner at all times (auto-kills stale runners)
concurrency:
  group: relay-runner-singleton
  cancel-in-progress: true

permissions: write-all

jobs:
  relay_runner:
    name: Execute Relay Server
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil requests Pillow python-telegram-bot telethon pyrogram tgcrypto aiohttp httpx beautifulsoup4 motor pymongo python-dotenv pycryptodome PyNaCl
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f scripts/requirements.txt ]; then pip install -r scripts/requirements.txt; fi
          find scripts/ -name "*requirements*.txt" -exec pip install -r {} + 2>/dev/null || true

      - name: Run Relay Server App
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          WORKFLOW_FILE: "server.yml"
          WORKFLOW_REF: ${{ github.ref_name || 'main' }}
          # Run duration: 330 minutes (5.5 hours) before graceful handoff
          RUN_DURATION_SECONDS: "19800"
        run: |
          python app.py
